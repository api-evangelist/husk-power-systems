aid: husk-power-systems
name: Husk Power Systems
description: Husk Power Systems is an energy technology company, founded in 2008 and headquartered in
  Fort Collins, Colorado with operating hubs in Patna, Mumbai and Pune (India) and Abuja (Nigeria), that
  builds, owns and operates AI-enabled distributed renewable energy systems — community solar minigrids,
  commercial and industrial solar, and residential rooftop — for unserved and underserved communities,
  businesses and households across Africa and Asia. Husk operates one of the largest minigrid fleets in
  the world and pairs it with pay-as-you-go smart metering, a customer mobile app (HUSKify) and an internal
  operations platform (Husk Neuron). Its software is delivered as end-user and operator products; Husk
  publishes no public developer program, API documentation, SDKs or machine-readable API specifications.
